<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0c0e" id="metaThemeColor" />
  <title>404 — Page Not Found | CapTax AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23F0502D'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-weight='bold'>₹</text></svg>" />
  <script>
    (function() {
      const s = localStorage.getItem('captax-theme') || 'system';
      const e = s === 'system' ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : s;
      document.documentElement.setAttribute('data-theme', e);
      document.documentElement.style.colorScheme = e;
    })();
  </script>
  <link rel="stylesheet" href="/styles/theme.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    body {
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .badge {
      font-size: 5rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-secondary);
      max-width: 400px;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: #fff;
      border-radius: 9999px;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="badge">404</div>
  <h1>Page not found</h1>
  <p>The page you are looking for doesn't exist or has been moved.</p>
  <div>
    <a href="/" class="btn">Return to home</a>
  </div>
</body>
</html>
